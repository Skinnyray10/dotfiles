gui:
  # Cyberpunk: Edgerunners (see "Theme palette" in the README).
  theme:
    activeBorderColor: ['#fcee0a', bold]
    inactiveBorderColor: ['#6b5b8a']
    searchingActiveBorderColor: ['#00f0ff', bold]
    optionsTextColor: ['#00f0ff']
    selectedLineBgColor: ['#2a1840']
    inactiveViewSelectedLineBgColor: ['#1a1026']
    cherryPickedCommitFgColor: ['#0b0614']
    cherryPickedCommitBgColor: ['#00f0ff']
    markedBaseCommitFgColor: ['#0b0614']
    markedBaseCommitBgColor: ['#fcee0a']
    unstagedChangesColor: ['#ff2a6d']
    defaultFgColor: ['#d9f6ff']
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
