# GENERATED by theme/generate.py from theme/palette.toml. Edit the template, not this file.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#BC48DD)\
$os\
$username\
[](bg:#FE5F7E fg:#BC48DD)\
$directory\
[](fg:#FE5F7E bg:#F1E607)\
$git_branch\
$git_status\
[](fg:#F1E607 bg:#03D1EA)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#03D1EA bg:#41D968)\
$docker_context\
[](fg:#41D968 bg:#1B1D45)\
$time\
[ ](fg:#1B1D45)\
$line_break\
$character\
"""

# Second line: a neon prompt arrow (yellow = ok, pink = last command failed).
[character]
success_symbol = "[❯](bold #F1E607)"
error_symbol = "[❯](bold #FE5F7E)"


# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#BC48DD fg:#0B0C24"
style_root = "bg:#BC48DD fg:#0B0C24"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#BC48DD fg:#0B0C24"
disabled = true # Disabled by default

[directory]
style = "bg:#FE5F7E fg:#0B0C24"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#41D968 fg:#0B0C24"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#F1E607 fg:#0B0C24"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#F1E607 fg:#0B0C24"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#03D1EA fg:#0B0C24"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1B1D45 fg:#03D1EA"
format = '[ ♥ $time ]($style)'
