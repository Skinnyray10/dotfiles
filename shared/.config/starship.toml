"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#b026ff)\
$os\
$username\
[](bg:#ff2a6d fg:#b026ff)\
$directory\
[](fg:#ff2a6d bg:#fcee0a)\
$git_branch\
$git_status\
[](fg:#fcee0a bg:#00f0ff)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#00f0ff bg:#05ffa1)\
$docker_context\
[](fg:#05ffa1 bg:#2a1840)\
$time\
[ ](fg:#2a1840)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#b026ff fg:#0b0614"
style_root = "bg:#b026ff fg:#0b0614"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#b026ff fg:#0b0614"
disabled = true # Disabled by default

[directory]
style = "bg:#ff2a6d fg:#0b0614"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#05ffa1 fg:#0b0614"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#fcee0a fg:#0b0614"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#fcee0a fg:#0b0614"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#00f0ff fg:#0b0614"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#2a1840 fg:#00f0ff"
format = '[ ♥ $time ]($style)'
